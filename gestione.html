<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gestione prenotazioni — Ashtanga Yoga Catania</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:var(--sand)}
  .g-top{position:sticky;top:0;z-index:10;background:rgba(243,238,231,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .g-top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
  .g-top b{font:500 1.25rem var(--serif)}
  .g-actions{display:flex;gap:8px;align-items:center}
  .g-main{padding-top:24px;padding-bottom:80px}
  .login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px}
  .login h1{font-size:2rem}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
  .tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
  .tabs button{border:0;background:none;font:500 .86rem var(--sans);padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
  .tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
  .search{flex:1;min-width:180px;max-width:320px;font:inherit;font-size:16px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat b{display:block;font:500 1.8rem/1 var(--serif);font-variant-numeric:lining-nums}
  .stat span{font-size:.78rem;color:var(--muted)}
  .lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .lesson-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .lesson-h h2{font:600 1rem/1.3 var(--sans);margin:0}
  .lesson-h small{display:block;font-weight:400;color:var(--muted);font-size:.82rem;margin-top:2px}
  .pill{display:inline-block;font:600 .74rem/1 var(--sans);padding:6px 10px;border-radius:999px;white-space:nowrap}
  .ok{background:#E3EFE0;color:#2F5D2A}.warn{background:#FBEBD9;color:#8A4B12}.off{background:#EEE;color:#666}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  td,th{padding:10px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font:600 .7rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#FCFAF7}
  tr:last-child td{border-bottom:0}
  tr.annullata td{color:#999;text-decoration:line-through}
  tr.annullata td.st{text-decoration:none}
  .contact a{text-decoration:none;margin-right:10px;white-space:nowrap}
  .contact a.wa{color:var(--wa);font-weight:500}
  .empty{padding:16px 18px;color:var(--muted);font-size:.9rem}
  .g-note{color:var(--muted);font-size:.84rem;font-weight:400;margin:0}
  .upd{font-size:.8rem;color:var(--muted)}
  @media (max-width:560px){#upd{display:none}.g-top b{font-size:1.05rem}}
  .err{color:#B3261E;font-size:.9rem;margin-top:12px}
  @media (max-width:700px){
    .stats{grid-template-columns:repeat(3,1fr)}
    .stat b{font-size:1.4rem}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{padding:12px 16px;border-bottom:1px solid var(--line)}
    td{border:0;padding:2px 0}
    td.n{font-weight:600}
    td:empty{display:none}
  }
</style>
</head>
<body>

<header class="g-top">
  <div class="wrap">
    <b>Gestione prenotazioni</b>
    <div class="g-actions" id="g-actions" hidden>
      <span class="upd" id="upd"></span>
      <button class="btn btn-ghost btn-sm" id="refresh" type="button">Aggiorna</button>
      <button class="btn btn-ghost btn-sm" id="logout" type="button">Esci</button>
    </div>
  </div>
</header>

<main class="wrap g-main">
  <form class="login" id="login" hidden>
    <span class="eyebrow">Area riservata</span>
    <h1>Accedi</h1>
    <p class="muted" style="font-size:.9rem">Solo lettura: da qui non si può modificare né cancellare nulla.</p>
    <div class="field"><label for="pwd">Password</label><input id="pwd" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary" style="width:100%" type="submit" id="login-btn">Entra</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>

  <section id="dash" hidden style="padding:0">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <div class="tabs" role="group" aria-label="Periodo">
        <button type="button" data-view="prossime" aria-pressed="true">Prossime lezioni</button>
        <button type="button" data-view="passate" aria-pressed="false">Ultimi 7 giorni</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Cerca nome o telefono…" aria-label="Cerca">
    </div>
    <div id="list"></div>
    <p class="upd" style="margin-top:20px">Per modificare o annullare una prenotazione usa il <a id="sheet-link" target="_blank" rel="noopener">foglio Google</a>. I dati si aggiornano da soli ogni minuto.</p>
  </section>
</main>

<script src="js/config.js"></script>
<script>
(function () {
  "use strict";
  var C = window.YOGA_CONFIG || {};
  var KEY = "yoga_gestione";
  var GIORNI = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
  var MESI = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
  var $ = function (s) { return document.querySelector(s); };
  var data = null, view = "prossime", timer = null;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function getPwd() { try { return sessionStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
  function setPwd(v) { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) {} }
  function giorno(iso) { var p = iso.split("-"), d = new Date(+p[0], p[1] - 1, +p[2]); return GIORNI[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()]; }
  function waNum(t) {
    var n = String(t).replace(/\D/g, "");
    if (n.indexOf("00") === 0) n = n.slice(2);
    if (n.length === 10 && n[0] === "3") n = "39" + n;
    return n;
  }

  function call(pwd) {
    return fetch(C.apiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "gestione", password: pwd }) })
      .then(function (r) { return r.json(); });
  }

  function showLogin(msg) {
    clearInterval(timer);
    $("#dash").hidden = true; $("#g-actions").hidden = true; $("#login").hidden = false;
    $("#login-err").textContent = msg || "";
    setTimeout(function () { $("#pwd").focus(); }, 30);
  }

  function load(silent) {
    var pwd = getPwd();
    if (!pwd) return showLogin();
    if (!silent) $("#upd").textContent = "Aggiornamento…";
    return call(pwd).then(function (j) {
      if (!j.ok) {
        if (j.auth === false) setPwd("");
        return showLogin(j.error);
      }
      data = j;
      $("#login").hidden = true; $("#dash").hidden = false; $("#g-actions").hidden = false;
      $("#upd").textContent = "Aggiornato alle " + j.aggiornato.slice(-5);
      $("#sheet-link").href = j.foglio;
      render();
    }).catch(function () { $("#upd").textContent = "Connessione non riuscita, riprovo…"; });
  }

  function gruppi() {
    var map = {}, oggi = data.oggi;
    data.lezioni.forEach(function (l) { map[l.id] = { data: l.data, ora: l.ora, titolo: l.titolo, sede: l.sede, posti: l.posti, persone: [] }; });
    data.prenotazioni.forEach(function (p) {
      var id = p.data + " " + p.ora;
      if (!map[id]) map[id] = { data: p.data, ora: p.ora, titolo: p.titolo, sede: "", posti: 0, persone: [] };
      map[id].persone.push(p);
    });
    var out = Object.keys(map).map(function (k) {
      var g = map[k];
      g.annullata = data.annullate.some(function (a) { return a.data === g.data && (!a.ora || a.ora === g.ora); });
      g.attivi = g.persone.filter(function (p) { return p.stato !== "Annullata"; }).length;
      g.futura = g.data > oggi || (g.data === oggi && data.lezioni.some(function (l) { return l.id === g.data + " " + g.ora; }));
      return g;
    });
    out.sort(function (a, b) { var x = a.data + a.ora, y = b.data + b.ora; return view === "prossime" ? (x < y ? -1 : 1) : (x > y ? -1 : 1); });
    return out;
  }

  function render() {
    var q = $("#q").value.trim().toLowerCase();
    var all = gruppi();
    var fut = all.filter(function (g) { return g.futura && !g.annullata; });
    var sotto = fut.filter(function (g) { return data.minimo && g.attivi < data.minimo; }).length;
    var tot = fut.reduce(function (s, g) { return s + g.attivi; }, 0);
    $("#stats").innerHTML =
      '<div class="stat"><b>' + fut.length + '</b><span>lezioni in programma</span></div>' +
      '<div class="stat"><b>' + tot + '</b><span>prenotazioni attive</span></div>' +
      '<div class="stat"><b>' + sotto + '</b><span>sotto il minimo di ' + data.minimo + '</span></div>';

    var list = all.filter(function (g) { return view === "prossime" ? g.futura : !g.futura; });
    if (q) list = list.map(function (g) {
      var c = Object.assign({}, g);
      c.persone = g.persone.filter(function (p) { return (p.nome + " " + p.telefono + " " + p.email).toLowerCase().indexOf(q) >= 0; });
      return c;
    }).filter(function (g) { return g.persone.length; });

    if (!list.length) { $("#list").innerHTML = '<div class="lesson"><div class="empty">' + (q ? "Nessun risultato." : view === "prossime" ? "Nessuna lezione in programma." : "Nessuna prenotazione negli ultimi 7 giorni.") + "</div></div>"; return; }

    $("#list").innerHTML = list.map(function (g) {
      var pill = g.annullata ? '<span class="pill off">Lezione annullata</span>'
        : !data.minimo ? '<span class="pill ok">' + g.attivi + " iscritti</span>"
        : g.attivi >= data.minimo ? '<span class="pill ok">✓ ' + g.attivi + " iscritti · minimo raggiunto</span>"
        : '<span class="pill warn">' + g.attivi + " su " + data.minimo + " · ne mancano " + (data.minimo - g.attivi) + "</span>";
      var righe = g.persone.length ? '<table><thead><tr><th>Nome</th><th>Contatti</th><th>Note</th><th>Stato</th></tr></thead><tbody>' +
        g.persone.map(function (p) {
          var w = waNum(p.telefono);
          return '<tr class="' + (p.stato === "Annullata" ? "annullata" : "") + '">' +
            '<td class="n">' + esc(p.nome) + '<div class="g-note">prenotato il ' + esc(p.ricevuta) + "</div></td>" +
            '<td class="contact">' + (w ? '<a class="wa" href="https://wa.me/' + w + '" target="_blank" rel="noopener">WhatsApp</a><a href="tel:+' + w + '">' + esc(p.telefono) + "</a>" : "") +
            (p.email ? '<br><a href="mailto:' + esc(p.email) + '">' + esc(p.email) + "</a>" : "") + "</td>" +
            '<td class="g-note">' + esc(p.note) + "</td>" +
            '<td class="st"><span class="pill ' + (p.stato === "Annullata" ? "off" : "ok") + '">' + esc(p.stato) + "</span></td></tr>";
        }).join("") + "</tbody></table>"
        : '<div class="empty">Ancora nessun prenotato.</div>';
      return '<article class="lesson"><div class="lesson-h"><h2>' + esc(giorno(g.data)) + " · " + esc(g.ora) +
        "<small>" + esc(g.titolo) + (g.posti ? " · " + g.attivi + "/" + g.posti + " posti" : "") + "</small></h2>" + pill + "</div>" + righe + "</article>";
    }).join("");
  }

  $("#login").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("#pwd").value;
    if (!v) return;
    $("#login-btn").disabled = true; $("#login-btn").textContent = "Verifica…";
    setPwd(v);
    load().then(function () {
      $("#login-btn").disabled = false; $("#login-btn").textContent = "Entra"; $("#pwd").value = "";
      clearInterval(timer); if (data && !$("#dash").hidden) timer = setInterval(function () { load(true); }, 60000);
    });
  });
  $("#refresh").addEventListener("click", function () { load(); });
  $("#logout").addEventListener("click", function () { setPwd(""); data = null; showLogin(); });
  $("#q").addEventListener("input", function () { if (data) render(); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function (b) {
    b.addEventListener("click", function () {
      view = b.getAttribute("data-view");
      Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function (x) { x.setAttribute("aria-pressed", x === b); });
      render();
    });
  });

  if (!C.apiUrl) { showLogin("Il sito non è ancora collegato al Google Sheet."); return; }
  if (getPwd()) { load().then(function () { if (data) timer = setInterval(function () { load(true); }, 60000); }); }
  else showLogin();
})();
</script>
</body>
</html>
